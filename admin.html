<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StealthyStream | پنل مدیریت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl w-full mx-auto space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center">
          <i data-lucide="shield" class="text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-white">StealthyStream</h1>
          <p class="text-xs text-slate-400">پنل مدیریت تحت وب (GitHub API)</p>
        </div>
      </div>
      <button onclick="toggleModal('configModal')" class="flex items-center gap-2 bg-slate-800/80 px-4 py-2.5 rounded-xl border border-slate-700 text-xs hover:bg-slate-700">
        <i data-lucide="key" class="w-4 h-4 text-cyan-400"></i> تنظیمات توکن
      </button>
    </div>

    <!-- Actions -->
    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6">
      <h2 class="text-sm font-bold text-cyan-400 mb-4 flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> افزودن کاربر</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <input type="text" id="usernameInput" placeholder="شناسه کاربر" class="bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-cyan-500 outline-none">
        <input type="date" id="expiryInput" class="bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-cyan-500 outline-none">
        <button onclick="addOrUpdateUser()" class="bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl font-bold text-sm">ثبت در لیست</button>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800/80 flex justify-between items-center bg-slate-950/30">
        <span class="text-sm font-bold text-slate-300">لیست کاربران</span>
        <button onclick="loadUsersFromGitHub()" class="text-xs text-slate-400 hover:text-white"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
      </div>
      <table class="w-full text-right text-sm">
        <thead class="bg-slate-950/60 text-slate-400 uppercase text-xs">
          <tr><th class="py-3 px-5">نام کاربر</th><th class="py-3 px-5">تاریخ انقضا</th><th class="py-3 px-5">وضعیت</th><th class="py-3 px-5">عملیات</th></tr>
        </thead>
        <tbody id="userTableBody"><tr><td colspan="4" class="text-center py-8 text-slate-500">بارگذاری...</td></tr></tbody>
      </table>
    </div>

    <!-- Commit Footer -->
    <div class="flex justify-end bg-slate-900/30 border border-slate-800/60 p-4 rounded-2xl">
      <button id="commitBtn" onclick="commitChangesToGitHub()" class="bg-gradient-to-r from-emerald-600 to-teal-600 px-6 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-4 h-4"></i> ذخیره تغییرات روی گیت‌هاب
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6">
      <h3 class="text-lg font-bold mb-4">تنظیمات اتصال</h3>
      <input id="ghOwner" placeholder="Owner (مثلاً majid)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 mb-3 text-sm">
      <input id="ghRepo" placeholder="Repo (مثلاً StealthyStream)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 mb-3 text-sm">
      <input id="ghToken" type="password" placeholder="Personal Access Token" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 mb-4 text-sm">
      <button onclick="saveConfig()" class="w-full bg-cyan-600 py-2 rounded-xl font-bold text-sm">ذخیره و اتصال</button>
    </div>
  </div>

  <script>
    let usersData = {}, currentSha = "";

    function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); document.getElementById(id).classList.toggle('flex'); }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (!localStorage.getItem('gh_token')) toggleModal('configModal');
      else loadUsersFromGitHub();
    });

    function saveConfig() {
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      toggleModal('configModal');
      loadUsersFromGitHub();
    }

    async function loadUsersFromGitHub() {
      const o = localStorage.getItem('gh_owner'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token');
      if (!o || !r || !t) return;
      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json?t=${Date.now()}`, { headers: { Authorization: `Bearer ${t}` }});
        if (!res.ok) throw new Error('فایل یافت نشد');
        const data = await res.json();
        currentSha = data.sha;
        usersData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        renderTable();
      } catch (err) { alert('خطا در دریافت لیست: ' + err.message); }
    }

    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = Object.entries(usersData).map(([u, e]) => `
        <tr class="border-b border-slate-800/50">
          <td class="py-3 px-5 font-bold">${u}</td>
          <td class="py-3 px-5 font-mono text-xs text-slate-400">${e}</td>
          <td class="py-3 px-5 text-xs">${new Date(e) < new Date() ? '<span class="text-rose-400">منقضی</span>' : '<span class="text-emerald-400">فعال</span>'}</td>
          <td class="py-3 px-5"><button onclick="deleteUser('${u}')" class="text-slate-500 hover:text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function addOrUpdateUser() {
      const u = document.getElementById('usernameInput').value.trim(), e = document.getElementById('expiryInput').value;
      if (!u || !e) return alert('فیلدها خالیه!');
      usersData[u] = e;
      renderTable();
    }

    function deleteUser(u) { delete usersData[u]; renderTable(); }

    async function commitChangesToGitHub() {
      const o = localStorage.getItem('gh_owner'), r = localStorage.getItem('gh_repo'), t = localStorage.getItem('gh_token'), btn = document.getElementById('commitBtn');
      btn.disabled = true; btn.innerText = 'در حال ثبت...';
      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Update via WebPanel', content: btoa(unescape(encodeURIComponent(JSON.stringify(usersData, null, 2)))), sha: currentSha })
        });
        if (!res.ok) throw new Error('خطا در ذخیره');
        currentSha = (await res.json()).content.sha;
        alert('✅ با موفقیت ثبت شد!');
      } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="upload-cloud" class="w-4 h-4"></i> ذخیره تغییرات روی گیت‌هاب'; }
    }
  </script>
</body>
</html>
