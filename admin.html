<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUB Users | پنل مدیریت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- کتابخانه تقویم پاپ‌آپ مدرن با تم تاریک برای دسکتاپ -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    /* استایل اختصاصی تقویم دارک برای هماهنگی با تم پنل */
    .flatpickr-calendar {
      background: #0f172a !important;
      border: 1px solid #1e293b !important;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5) !important;
      border-radius: 1rem !important;
      font-family: 'Vazirmatn', sans-serif !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-2 sm:p-6">

  <div class="max-w-6xl w-full mx-auto space-y-4 sm:space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="shield" class="w-5 h-5 sm:w-6 sm:h-6 text-white"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-black text-white tracking-wide">SUB Users</h1>
          <p class="text-[10px] sm:text-xs text-slate-400">پنل مدیریت اشتراک‌ها</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadUsersFromGitHub(true)" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 hover:bg-slate-700 text-emerald-400 transition shadow" title="رفرش داده‌ها">
          <i data-lucide="refresh-cw" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <button onclick="toggleModal('configModal')" class="flex items-center gap-1.5 bg-slate-800 px-3 py-2.5 rounded-xl border border-slate-700 text-xs sm:text-sm font-bold hover:bg-slate-700 transition shadow">
          <i data-lucide="key" class="w-4 h-4 text-blue-400"></i> تنظیمات
        </button>
      </div>
    </div>

    <!-- Add User & Search Area -->
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 space-y-3 shadow-xl">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="جستجوی سریع کاربر..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-10 py-2.5 text-sm sm:text-base text-white focus:border-blue-500 outline-none transition">
        <i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-3.5 text-slate-500"></i>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <input type="text" id="usernameInput" placeholder="نام کاربری جدید" class="bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:border-blue-500 outline-none text-white">
        
        <!-- فیلد تاریخ با قابلیت کلیک سراسری و باز شدن تقویم -->
        <div class="relative">
          <input type="text" id="expiryInput" placeholder="انتخاب تاریخ انقضا..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:border-blue-500 outline-none text-white cursor-pointer" readonly>
          <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-3.5 text-slate-500 pointer-events-none"></i>
        </div>

        <button onclick="addUserAction()" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-bold text-sm sm:text-base shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4"></i> افزودن کاربر
        </button>
      </div>

      <!-- دکمه‌های سریع تاریخ برای راحتی کار -->
      <div class="flex items-center gap-2 pt-1 text-xs text-slate-400 overflow-x-auto">
        <span class="shrink-0 font-bold text-slate-500">تاریخ سریع:</span>
        <button onclick="setQuickExpiry(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/60 text-slate-300 transition shrink-0">+۱ ماه</button>
        <button onclick="setQuickExpiry(3)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/60 text-slate-300 transition shrink-0">+۳ ماه</button>
        <button onclick="setQuickExpiry(12)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/60 text-slate-300 transition shrink-0">+۱ سال</button>
        <button onclick="setQuickExpiry('2030')" class="px-2.5 py-1 bg-indigo-950/60 hover:bg-indigo-900/60 rounded-lg border border-indigo-800/60 text-indigo-300 transition shrink-0">۲۰۳۰ (طولانی)</button>
      </div>
    </div>

    <!-- Users List Container -->
    <div id="userListContainer" class="space-y-2.5">
      <div class="text-center py-10 text-slate-500 text-sm">در حال اتصال...</div>
    </div>

  </div>

  <!-- Edit User Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
        <i data-lucide="edit-3" class="text-blue-400"></i> ویرایش کاربر
      </h3>
      <label class="text-xs text-slate-400 mb-1 block">نام کاربری:</label>
      <input id="editUsername" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 mb-3 text-sm text-slate-400 cursor-not-allowed outline-none font-bold">
      
      <label class="text-xs text-slate-400 mb-1 block">تاریخ انقضا جدید:</label>
      <div class="relative mb-5">
        <input id="editExpiry" type="text" placeholder="انتخاب تاریخ جدید..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-blue-500 outline-none cursor-pointer" readonly>
        <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-3 text-slate-500 pointer-events-none"></i>
      </div>

      <div class="flex gap-2">
        <button onclick="toggleModal('editModal')" class="flex-1 bg-slate-800 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-700 transition">انصراف</button>
        <button onclick="submitUpdate()" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-bold text-xs text-white hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">به‌روزرسانی</button>
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 flex flex-col items-center shadow-2xl">
      <h3 id="qrModalTitle" class="text-base font-bold mb-4 text-white">QR Code ساب</h3>
      <div id="qrcode" class="bg-white p-3 rounded-2xl mb-4 flex items-center justify-center min-h-[190px] shadow-inner"></div>
      <button onclick="toggleModal('qrModal')" class="w-full bg-slate-800 py-2 rounded-xl text-xs font-bold hover:bg-slate-700 transition">بستن</button>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
        <i data-lucide="key" class="text-blue-400"></i> تنظیمات اتصال گیت‌هاب
      </h3>
      <input id="ghOwner" placeholder="Owner (مثلاً majid1361)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-2.5 text-xs sm:text-sm focus:border-blue-500 outline-none text-white">
      <input id="ghRepo" placeholder="Repo (مثلاً SUB)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-2.5 text-xs sm:text-sm focus:border-blue-500 outline-none text-white">
      <input id="ghToken" type="password" placeholder="PAT Token (ghp_...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-4 text-xs sm:text-sm focus:border-blue-500 outline-none text-white">
      <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl font-bold text-sm text-white transition shadow-lg shadow-blue-600/25">ذخیره و اتصال</button>
    </div>
  </div>

  <script>
    let usersData = {};
    let currentSha = "";
    let fpAdd, fpEdit;

    function toggleModal(id) {
      const modal = document.getElementById(id);
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initDatePickers();

      document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      
      if (localStorage.getItem('gh_token')) {
        loadUsersFromGitHub();
      } else {
        toggleModal('configModal');
      }
    });

    // راه‌اندازی تقویم پاپ‌آپ
    function initDatePickers() {
      fpAdd = flatpickr("#expiryInput", {
        dateFormat: "Y-m-d",
        minDate: "today",
        disableMobile: false // روی گوشی از دیالوگ محلی اندروید و روی کامپیوتر از پاپ‌آپ دارک استفاده می‌کنه
      });

      fpEdit = flatpickr("#editExpiry", {
        dateFormat: "Y-m-d",
        disableMobile: false
      });
    }

    // تابع انتخاب سریع تاریخ
    function setQuickExpiry(val) {
      if (val === '2030') {
        fpAdd.setDate('2030-01-01');
      } else {
        const d = new Date();
        d.setMonth(d.getMonth() + val);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        fpAdd.setDate(`${yyyy}-${mm}-${dd}`);
      }
    }

    async function loadUsersFromGitHub(force = false) {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');
      const container = document.getElementById('userListContainer');

      if (!o || !r || !t) {
        container.innerHTML = '<div class="text-center py-6 text-amber-400 text-sm">لطفاً ابتدا تنظیمات اتصال را وارد کنید.</div>';
        return;
      }

      const cached = localStorage.getItem('users_cache');
      if (cached && !force) {
        try {
          usersData = JSON.parse(cached);
          renderUsers();
          fetchShaSilently(o, r, t);
          return;
        } catch (e) {
          console.warn("Cache parse failed, loading fresh...");
        }
      }

      container.innerHTML = '<div class="text-center py-8 text-slate-400 animate-pulse text-sm">در حال دریافت داده‌ها از گیت‌هاب...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json?t=${Date.now()}`, {
          headers: { 
            'Authorization': `Bearer ${t}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) {
          if (res.status === 404) throw new Error('فایل users.json در مخزن یافت نشد');
          if (res.status === 401) throw new Error('توکن گیت‌هاب نامعتبر یا منقضی شده است');
          throw new Error(`خطای ${res.status}`);
        }

        const data = await res.json();
        currentSha = data.sha;
        usersData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        localStorage.setItem('users_cache', JSON.stringify(usersData));
        renderUsers();
      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-rose-500 text-sm">❌ ${err.message}</div>`;
      }
    }

    async function fetchShaSilently(o, r, t) {
      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json?t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${t}` }
        });
        if (res.ok) {
          const data = await res.json();
          currentSha = data.sha;
        }
      } catch (e) {
        console.warn("Silent SHA fetch error:", e);
      }
    }

    function renderUsers() {
      const container = document.getElementById('userListContainer');
      const entries = Object.entries(usersData);

      if (entries.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">هیچ کاربری ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = entries.map(([u, e], index) => {
        const isExpired = new Date(e) < new Date();
        return `
          <div class="user-card flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2.5 sm:px-5 sm:py-3.5 hover:border-slate-700 transition shadow-sm gap-2">
            
            <div class="flex items-center gap-2.5 sm:gap-4 min-w-0">
              <span class="font-mono text-xs sm:text-sm font-bold text-slate-500 w-5 sm:w-6 text-center shrink-0">#${index + 1}</span>
              <div class="min-w-0">
                <div class="name-cell font-bold text-sm sm:text-base text-white truncate">${u}</div>
                <div class="text-[11px] sm:text-xs font-mono text-slate-400 truncate">${e}</div>
              </div>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
              ${isExpired 
                ? '<span class="px-2 py-0.5 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] sm:text-xs font-bold">منقضی</span>' 
                : '<span class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] sm:text-xs font-bold">فعال</span>'}
              
              <button onclick="copySubLink('${u}')" class="p-1.5 sm:p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 transition" title="کپی لینک ساب">
                <i data-lucide="link" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="generateQR('${u}')" class="p-1.5 sm:p-2 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 hover:bg-indigo-500/20 transition" title="نمایش QR">
                <i data-lucide="qr-code" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="openEditModal('${u}')" class="p-1.5 sm:p-2 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400 hover:bg-blue-500/20 transition" title="ویرایش">
                <i data-lucide="edit-3" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="deleteUser('${u}')" class="p-1.5 sm:p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 text-slate-400 hover:text-rose-400 hover:bg-rose-500/20 transition" title="حذف">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      document.querySelectorAll('.user-card').forEach(card => {
        const name = card.querySelector('.name-cell').innerText.toLowerCase();
        card.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    function openEditModal(u) {
      document.getElementById('editUsername').value = u;
      const expiry = usersData[u] || '';
      document.getElementById('editExpiry').value = expiry;
      if (fpEdit) fpEdit.setDate(expiry);
      toggleModal('editModal');
    }

    async function submitUpdate() {
      const u = document.getElementById('editUsername').value;
      const e = document.getElementById('editExpiry').value;
      if (!e) return alert('تاریخ انقضا الزامی است!');
      
      usersData[u] = e;
      const ok = await syncWithGitHub();
      if (ok) {
        toggleModal('editModal');
        renderUsers();
      }
    }

    async function addUserAction() {
      const u = document.getElementById('usernameInput').value.trim();
      const e = document.getElementById('expiryInput').value;

      if (!u || !e) {
        return alert('نام کاربری و تاریخ انقضا را مشخص کنید!');
      }

      usersData[u] = e;
      const ok = await syncWithGitHub();
      if (ok) {
        document.getElementById('usernameInput').value = '';
        if (fpAdd) fpAdd.clear();
        renderUsers();
      }
    }

    async function deleteUser(u) {
      if (!confirm(`آیا از حذف کاربر «${u}» مطمئن هستید؟`)) return;
      delete usersData[u];
      const ok = await syncWithGitHub();
      if (ok) renderUsers();
    }

    async function syncWithGitHub() {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');

      try {
        const utf8Bytes = new TextEncoder().encode(JSON.stringify(usersData, null, 2));
        let binaryStr = "";
        utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
        const base64Content = btoa(binaryStr);

        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${t}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: 'Update users via Admin Panel',
            content: base64Content,
            sha: currentSha
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `خطا در ذخیره‌سازی: کد ${res.status}`);
        }

        const resData = await res.json();
        currentSha = resData.content.sha;
        localStorage.setItem('users_cache', JSON.stringify(usersData));
        alert('✅ با موفقیت ذخیره شد!');
        return true;
      } catch (err) {
        alert('❌ خطا در سینک با گیت‌هاب: ' + err.message);
        return false;
      }
    }

    async function copySubLink(u) {
      const subLink = `https://sub-seven-psi.vercel.app/api?user=${encodeURIComponent(u)}#Sub:%20${encodeURIComponent(u)}`;
      try {
        await navigator.clipboard.writeText(subLink);
        alert(`✅ لینک اشتراک «${u}» کپی شد.`);
      } catch (err) {
        prompt('لینک زیر را کپی کنید:', subLink);
      }
    }

    function generateQR(u) {
      const subLink = `https://sub-seven-psi.vercel.app/api?user=${encodeURIComponent(u)}#Sub:%20${encodeURIComponent(u)}`;
      const container = document.getElementById("qrcode");
      document.getElementById("qrModalTitle").innerText = `QR Code: ${u}`;
      container.innerHTML = "";
      
      new QRCode(container, {
        text: subLink,
        width: 170,
        height: 170,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      toggleModal('qrModal');
    }

    function saveConfig() {
      const o = document.getElementById('ghOwner').value.trim();
      const r = document.getElementById('ghRepo').value.trim();
      const t = document.getElementById('ghToken').value.trim();

      if (!o || !r || !t) {
        return alert('هر سه فیلد تنظیمات الزامی است!');
      }

      localStorage.setItem('gh_owner', o);
      localStorage.setItem('gh_repo', r);
      localStorage.setItem('gh_token', t);
      localStorage.removeItem('users_cache');

      toggleModal('configModal');
      loadUsersFromGitHub(true);
    }
  </script>
</body>
</html>
