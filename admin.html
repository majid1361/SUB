<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- PWA & Mobile App Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SUB-Users">
  <meta name="theme-color" content="#050811">

  <!-- Favicon & Icons from GitHub Profile -->
  <link rel="icon" type="image/png" href="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png">
  <link rel="apple-touch-icon" href="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png">

  <title>SUB-Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Flatpickr Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    
    .flatpickr-calendar {
      background: #0f172a !important;
      border: 1px solid #1e293b !important;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5) !important;
      border-radius: 1rem !important;
      font-family: 'Vazirmatn', sans-serif !important;
    }
    
    /* Optimized Glass Panel (Lightweight) */
    .glass-header {
      background: #0f172ae6;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .card-solid {
      background: #0b1120;
      border: 1px solid #1e293b;
    }

    /* GPU Accelerated Row */
    .user-row {
      background: #0b1120;
      border: 1px solid #1e293b;
      transform: translateZ(0);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .user-row:hover {
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    /* Smooth Toast */
    @keyframes slideIn {
      from { transform: translateY(100%) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(100%) scale(0.95); opacity: 0; }
    }
    .toast-in { animation: slideIn 0.2s cubic-bezier(0, 0, 0.2, 1) forwards; }
    .toast-out { animation: slideOut 0.2s cubic-bezier(0.4, 0, 1, 1) forwards; }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen p-2 sm:p-6 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-6 sm:translate-x-0 z-[100] flex flex-col gap-2 pointer-events-none w-[90%] max-w-sm"></div>

  <div class="max-w-6xl w-full mx-auto space-y-4 sm:space-y-6">
    
    <!-- Header -->
    <div class="glass-header rounded-2xl p-4 sm:p-5 shadow-xl flex justify-between items-center relative overflow-hidden">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-14 sm:h-14 flex items-center justify-center shrink-0">
          <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" class="w-full h-full object-contain invert" alt="GitHub Logo" />
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-xl font-black text-white tracking-wide">SUB Users</h1>
          </div>
          <p class="text-[10px] sm:text-xs text-slate-800">مدیریت اشتراک‌ها</p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="exportBackupJSON()" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 hover:bg-slate-700 text-sky-400 hover:text-sky-300 transition shadow" title="دانلود بک‌آپ (JSON)">
          <i data-lucide="download" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <button onclick="loadUsersFromGitHub(true)" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 hover:bg-slate-700 text-emerald-400 hover:text-emerald-300 transition shadow" title="همگام‌سازی">
          <i data-lucide="refresh-cw" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <!-- دکمه مدیریت کانفیگ‌ها همراه با عدد تعداد کانفیگ -->
        <button onclick="openSubModal()" class="relative bg-slate-800 p-2.5 rounded-xl border border-slate-700 hover:bg-slate-700 text-amber-400 hover:text-amber-300 transition shadow" title="مدیریت کانفیگ‌ها (sub.txt)">
          <i data-lucide="zap" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          <span id="subBadge" class="absolute -top-1.5 -left-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black flex items-center justify-center shadow">0</span>
        </button>
        <!-- دکمه تنظیمات -->
        <button onclick="toggleModal('configModal')" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 hover:bg-slate-700 text-blue-400 hover:text-blue-300 transition shadow" title="تنظیمات اتصال گیت‌هاب">
          <i data-lucide="key" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
      </div>
    </div>

    <!-- Quick Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3.5">
      <div class="card-solid rounded-xl p-3 sm:p-4 shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-400 font-semibold mb-1">کل مشترکین</div>
          <div id="statTotal" class="text-xl sm:text-2xl font-black text-white">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20">
          <i data-lucide="users" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
      </div>

      <div class="card-solid rounded-xl p-3 sm:p-4 shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-400 font-semibold mb-1">فعال</div>
          <div id="statActive" class="text-xl sm:text-2xl font-black text-emerald-400">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
          <i data-lucide="check-circle" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
      </div>

      <div class="card-solid rounded-xl p-3 sm:p-4 shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-400 font-semibold mb-1">رو به اتمام</div>
          <div id="statExpiring" class="text-xl sm:text-2xl font-black text-amber-400">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
          <i data-lucide="clock" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
      </div>

      <div class="card-solid rounded-xl p-3 sm:p-4 shadow flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-400 font-semibold mb-1">منقضی شده</div>
          <div id="statExpired" class="text-xl sm:text-2xl font-black text-rose-400">0</div>
        </div>
        <div class="w-9 h-9 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
          <i data-lucide="alert-triangle" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
      </div>
    </div>

    <!-- Add User & Search Area -->
    <div class="card-solid rounded-2xl p-4 sm:p-5 space-y-3.5 shadow-xl">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <input type="text" id="usernameInput" placeholder="نام کاربری جدید..." class="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:border-blue-500 outline-none text-white transition placeholder:text-slate-600">
        
        <div class="relative">
          <input type="text" id="expiryInput" placeholder="انتخاب تاریخ انقضا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:border-blue-500 outline-none text-white cursor-pointer placeholder:text-slate-600" readonly>
          <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-3.5 text-slate-500 pointer-events-none"></i>
        </div>

        <button onclick="addUserAction()" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-bold text-sm sm:text-base shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2 active:scale-98">
          <i data-lucide="user-plus" class="w-4 h-4"></i> افزودن کاربر
        </button>
      </div>

      <!-- Quick Presets -->
      <div class="flex items-center gap-2 pt-0.5 text-xs text-slate-400 overflow-x-auto pb-1">
        <span class="shrink-0 font-bold text-slate-500 flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i> تاریخ سریع:</span>
        <button type="button" onclick="setQuickExpiry(1, 'add')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۱ ماه</button>
        <button type="button" onclick="setQuickExpiry(3, 'add')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۳ ماه</button>
        <button type="button" onclick="setQuickExpiry(12, 'add')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۱ سال</button>
        <button type="button" onclick="setQuickExpiry('2050', 'add')" class="px-2.5 py-1 bg-indigo-950/70 hover:bg-indigo-900/80 rounded-lg border border-indigo-800 text-indigo-300 transition shrink-0">نامحدود</button>
      </div>

      <div class="border-t border-slate-800 pt-3 flex flex-col sm:flex-row gap-2.5 justify-between items-stretch sm:items-center">
        <!-- Search -->
        <div class="relative flex-1">
          <input type="text" id="searchInput" oninput="filterUsers()" placeholder="جستجوی سریع در نام‌ها یا تاریخ..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-10 py-2 text-xs sm:text-sm text-white focus:border-blue-500 outline-none transition placeholder:text-slate-600">
          <i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-2.5 text-slate-500"></i>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 overflow-x-auto text-[11px] sm:text-xs">
          <button onclick="setFilter('all', this)" class="filter-btn active px-3 py-1.5 rounded-lg font-bold bg-blue-600 text-white transition shrink-0">همه</button>
          <button onclick="setFilter('active', this)" class="filter-btn px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-white transition shrink-0">فعال‌ها</button>
          <button onclick="setFilter('expiring', this)" class="filter-btn px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-amber-400 transition shrink-0">رو به اتمام</button>
          <button onclick="setFilter('expired', this)" class="filter-btn px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-rose-400 transition shrink-0">منقضی‌ها</button>
        </div>
      </div>
    </div>

    <!-- Users List Container -->
    <div id="userListContainer" class="space-y-2">
      <div class="text-center py-12 text-slate-500 text-sm flex items-center justify-center gap-2">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-400"></i> در حال اتصال و بارگذاری...
      </div>
    </div>

  </div>

  <!-- Edit User Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl relative">
      <h3 class="text-base sm:text-lg font-bold mb-4 text-white flex items-center gap-2">
        <i data-lucide="edit-3" class="text-blue-400 w-5 h-5"></i> ویرایش و تمدید هوشمند کاربر
      </h3>
      
      <label class="text-xs text-slate-400 mb-1 block">نام کاربری:</label>
      <input id="editUsername" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-3 text-sm text-slate-300 font-mono font-bold cursor-not-allowed outline-none">
      
      <label class="text-xs text-slate-400 mb-1 block">تاریخ انقضا:</label>
      <div class="relative mb-2.5">
        <input id="editExpiry" type="text" placeholder="انتخاب تاریخ جدید..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-blue-500 outline-none cursor-pointer font-mono" readonly>
        <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-3.5 text-slate-500 pointer-events-none"></i>
      </div>

      <div class="flex items-center gap-1.5 mb-5 text-xs text-slate-400 overflow-x-auto pb-1">
        <span class="shrink-0 font-bold text-slate-500 flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3 text-amber-400"></i> تمدید هوشمند:</span>
        <button type="button" onclick="setQuickExpiry(1, 'edit')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۱ ماه</button>
        <button type="button" onclick="setQuickExpiry(3, 'edit')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۳ ماه</button>
        <button type="button" onclick="setQuickExpiry(12, 'edit')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 transition shrink-0">+۱ سال</button>
        <button type="button" onclick="setQuickExpiry('2050', 'edit')" class="px-2.5 py-1 bg-indigo-950/70 hover:bg-indigo-900/80 rounded-lg border border-indigo-800 text-indigo-300 transition shrink-0">نامحدود</button>
      </div>

      <div class="flex gap-2">
        <button onclick="toggleModal('editModal')" class="flex-1 bg-slate-800 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-700 transition text-slate-300">انصراف</button>
        <button onclick="submitUpdate()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl font-bold text-xs text-white transition shadow-lg shadow-blue-600/25">ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 flex flex-col items-center shadow-2xl">
      <div class="w-full flex items-center justify-between mb-4">
        <h3 id="qrModalTitle" class="text-sm font-bold text-white truncate">QR Code ساب</h3>
        <button onclick="toggleModal('qrModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="qrcode" class="bg-white p-3 rounded-2xl mb-4 flex items-center justify-center min-h-[190px] shadow-inner"></div>
      <button onclick="toggleModal('qrModal')" class="w-full bg-slate-800 py-2 rounded-xl text-xs font-bold hover:bg-slate-700 transition">بستن</button>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
        <i data-lucide="key" class="text-blue-400"></i> تنظیمات اتصال گیت‌هاب
      </h3>
      <input id="ghOwner" placeholder="Owner (مثلاً majid1361)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-2.5 text-xs sm:text-sm focus:border-blue-500 outline-none text-white">
      <input id="ghRepo" placeholder="Repo (مثلاً SUB)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-2.5 text-xs sm:text-sm focus:border-blue-500 outline-none text-white">
      <input id="ghToken" type="password" placeholder="PAT Token (ghp_...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 mb-4 text-xs sm:text-sm focus:border-blue-500 outline-none text-white font-mono">
      <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl font-bold text-sm text-white transition shadow-lg shadow-blue-600/25">ذخیره و اتصال</button>
    </div>
  </div>

  <!-- Modal مدیریت کانفیگ‌ها (sub.txt) -->
  <div id="subModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-4 sm:p-5 shadow-2xl flex flex-col gap-3 max-h-[90vh]">
      
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="zap" class="w-5 h-5 text-amber-400"></i> مدیریت کانفیگ‌ها
        </h3>
        <span id="subLineCount" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 rounded-full px-2.5 py-1">۰ کانفیگ</span>
      </div>

      <!-- تب‌ها -->
      <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
        <button id="tabListBtn" onclick="switchSubTab('list')" class="flex-1 py-2 rounded-lg font-bold bg-amber-500 text-slate-950 transition">لیست و انتخاب</button>
        <button id="tabEditBtn" onclick="switchSubTab('edit')" class="flex-1 py-2 rounded-lg font-bold text-slate-400 hover:text-white transition">ویرایش متن</button>
      </div>

      <!-- باکس جستجو کانفیگ‌ها -->
      <div id="subSearchContainer" class="relative">
        <input type="text" id="subSearchInput" oninput="renderSubList()" placeholder="جستجو در نام، پروتکل یا لینک کانفیگ..."
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 pl-9 text-xs text-slate-200 placeholder-slate-500 focus:border-amber-500 outline-none transition" />
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>

      <!-- پنل لیست کانفیگ‌ها -->
      <div id="subListPanel" class="flex-1 overflow-y-auto space-y-1.5 min-h-[200px] max-h-[45vh] pr-1"></div>

      <!-- پنل ویرایش متن -->
      <textarea id="subContentArea" dir="ltr" rows="13" spellcheck="false"
        oninput="updateSubLineCount()"
        placeholder="vless://...&#10;vmess://...&#10;ss://..."
        class="hidden w-full flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-emerald-400 font-mono text-xs leading-5 resize-none focus:border-amber-500 outline-none shadow-inner"></textarea>

      <!-- نوار عملیات سلکت -->
      <div id="subSelectionBar" class="hidden flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs">
        <span class="text-slate-300 font-bold"><span id="selCount">۰</span> کانفیگ انتخاب شده</span>
        <div class="flex gap-1.5">
          <button onclick="selectAllConfigs()" class="px-2.5 py-1.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-lg font-bold hover:bg-blue-500/20 transition">انتخاب همه</button>
          <button onclick="copySelectedConfigs()" class="px-2.5 py-1.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-lg font-bold hover:bg-emerald-500/20 transition">کپی</button>
          <button onclick="deleteSelectedConfigs()" class="px-2.5 py-1.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-lg font-bold hover:bg-rose-500/20 transition">حذف</button>
          <button onclick="clearSubSelection()" class="px-2.5 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 rounded-lg font-bold hover:bg-slate-700 transition">لغو</button>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="toggleModal('subModal')" class="bg-slate-800 py-2.5 px-4 rounded-xl text-xs font-bold hover:bg-slate-700 transition text-slate-300">بستن</button>
        <button id="saveSubBtn" onclick="saveSubFileAction()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 active:scale-98">
          <i data-lucide="save" class="w-4 h-4"></i> ذخیره و انتشار کانفیگ‌ها
        </button>
      </div>
    </div>
  </div>

  <script>
    let usersData = {};
    let currentSha = "";
    let currentSubSha = "";
    let currentFilter = 'all';
    let selectedSubIndexes = new Set();
    let fpAdd, fpEdit;

    // Toast Notification System
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let borderCol = 'border-emerald-500/50';
      let icon = 'check-circle';
      let iconCol = 'text-emerald-400';

      if (type === 'error') {
        borderCol = 'border-rose-500/50';
        icon = 'alert-circle';
        iconCol = 'text-rose-400';
      } else if (type === 'warn') {
        borderCol = 'border-amber-500/50';
        icon = 'alert-triangle';

    function initDatePickers() {
      fpAdd = flatpickr("#expiryInput", {

    function setQuickExpiry(val, target = 'add') {
      const picker = (target === 'edit') ? fpEdit : fpAdd;
      if (!picker) return;

      if (val === '2050') {
        picker.setDate('2050-01-01');
        return;
      }

      let baseDate = new Date();

      if (target === 'edit') {
        const currentVal = document.getElementById('editExpiry').value;
        if (currentVal) {
          const parsed = new Date(currentVal);
          if (!isNaN(parsed.getTime()) && parsed > baseDate) {
            baseDate = parsed;
          }
        }
      }

      baseDate.setMonth(baseDate.getMonth() + val);
      const yyyy = baseDate.getFullYear();
      const mm = String(baseDate.getMonth() + 1).padStart(2, '0');
      const dd = String(baseDate.getDate()).padStart(2, '0');
      picker.setDate(`${yyyy}-${mm}-${dd}`);
    }

    // استانداردسازی انکود و دیکود UTF-8
    function decodeBase64Utf8(b64) {
      try {
        const cleanB64 = b64.replace(/\s/g, '');
        const binStr = atob(cleanB64);
        const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      } catch (e) {
        return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
      }
    }

    function encodeBase64Utf8(str) {
      const utf8Bytes = new TextEncoder().encode(str);
      let binaryStr = "";
      utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
      return btoa(binaryStr);
    }

    async function loadUsersFromGitHub(force = false) {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');
      const container = document.getElementById('userListContainer');

      if (!o || !r || !t) {
        container.innerHTML = '<div class="text-center py-6 text-amber-400 text-sm">لطفاً ابتدا تنظیمات اتصال را وارد کنید.</div>';
        return;
      }

      const cached = localStorage.getItem('users_cache');
      if (cached && !force) {
        try {
          usersData = JSON.parse(cached);
          renderUsers();
          fetchShaSilently(o, r, t);
          return;
        } catch (e) {
          console.warn("Cache parse failed, loading fresh...");
        }
      }

      container.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-400"></i> در حال بارگذاری از گیت‌هاب...</div>';
      lucide.createIcons();

      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json?t=${Date.now()}`, {
          headers: { 
            'Authorization': `token ${t}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) {
          if (res.status === 404) throw new Error('فایل users.json در مخزن یافت نشد');
          if (res.status === 401) throw new Error('توکن گیت‌هاب نامعتبر است');
          throw new Error(`خطای ${res.status}`);
        }

        const data = await res.json();
        currentSha = data.sha;
        usersData = JSON.parse(decodeBase64Utf8(data.content));
        localStorage.setItem('users_cache', JSON.stringify(usersData));
        renderUsers();
        if (force) showToast('همگام‌سازی انجام شد');
      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-rose-500 text-sm">❌ ${err.message}</div>`;
        showToast(err.message, 'error');
      }
    }

    async function fetchShaSilently(o, r, t) {
      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json?t=${Date.now()}`, {
          headers: { 'Authorization': `token ${t}` }
        });
        if (res.ok) {
          const data = await res.json();
          currentSha = data.sha;
        }
      } catch (e) {
        console.warn("Silent SHA error:", e);
      }
    }

    // ===== مدیریت sub.txt =====
    async function fetchSubConfigCountSilently() {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');
      if (!o || !r || !t) return;

      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/sub.txt?t=${Date.now()}`, {
          headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const data = await res.json();
          currentSubSha = data.sha;
          const content = decodeBase64Utf8(data.content);
          const count = countValidConfigs(content);
          document.getElementById('subBadge').innerText = count;
        }
      } catch (e) {
        console.warn("Silent sub.txt fetch error:", e);
      }
    }

    function countValidConfigs(text) {
      if (!text) return 0;
      return text.split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0 && !l.startsWith('#')).length;
    }

    function getSubConfigs() {
      return document.getElementById('subContentArea').value
        .split('\n').map(l => l.trim())
        .filter(l => l.length > 0 && !l.startsWith('#'));
    }

    function updateSubLineCount() {
      const content = document.getElementById('subContentArea').value;
      const count = countValidConfigs(content);
      document.getElementById('subLineCount').innerText = `${count} کانفیگ`;
    }

        function switchSubTab(tab) {

      const tabList = document.getElementById('tabListBtn');
      const tabEdit = document.getElementById('tabEditBtn');
      const selBar = document.getElementById('subSelectionBar');

        tabEdit.className = 'flex-1 py-2 rounded-lg font-bold bg-amber-500 text-slate-950 transition';
        tabList.className = 'flex-1 py-2 rounded-lg font-bold text-slate-400 hover:text-white transition';
        selBar.classList.add('hidden');

      }

        function renderSubList() {
      const configs = getSubConfigs();
      const panel = document.getElementById('subListPanel');
      const searchInput = document.getElementById('subSearchInput');
      const query = (searchInput ? searchInput.value : '').trim().toLowerCase();

      if (configs.length === 0) {
        panel.innerHTML = '<div class="text-center py-10 text-slate-500 text-xs">کانفیگی ثبت نشده است.</div>';
        updateSelBar();
        return;
      }

      // مپ کردن برای حفظ ایندکس اصلی در زمان جستجو
      const mapped = configs.map((c, originalIndex) => {
        const proto = c.split('://')[0] || 'unknown';
        let configName = proto;
        const hashIdx = c.indexOf('#');
        if (hashIdx !== -1) {
          const rawName = c.slice(hashIdx + 1).trim();
          if (rawName) {
            try { configName = decodeURIComponent(rawName); }
            catch (e) { configName = rawName; }
          }
        }
        return { c, originalIndex, proto, configName };
      });

      // فیلتر کردن براساس کلمه جستجو
      const filtered = query ? mapped.filter(item => {
        return item.configName.toLowerCase().includes(query) ||
               item.proto.toLowerCase().includes(query) ||
               item.c.toLowerCase().includes(query);
      }) : mapped;

      if (filtered.length === 0) {
        panel.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs">کانفیگی مطابق با جستجوی شما یافت نشد.</div>';
        updateSelBar();
        return;
      }

      panel.innerHTML = filtered.map(item => {
        const { c, originalIndex: i, proto, configName } = item;

        const escapeHtml = (str) => str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        const safeConfigName = escapeHtml(configName);

        const protoColors = {
          'vless':     'text-emerald-400 bg-emerald-500/10 border-emerald-500/20',
          'vmess':     'text-sky-400 bg-sky-500/10 border-sky-500/20',
          'trojan':    'text-rose-400 bg-rose-500/10 border-rose-500/20',
          'hysteria2': 'text-amber-400 bg-amber-500/10 border-amber-500/20',
          'hysteria':  'text-amber-400 bg-amber-500/10 border-amber-500/20',
          'ss':        'text-indigo-400 bg-indigo-500/10 border-indigo-500/20'
        };
        const pClass = protoColors[proto] || 'text-slate-400 bg-slate-800 border-slate-700';
        const checked = selectedSubIndexes.has(i);

        return `
          <div class="flex items-center gap-2 p-2 rounded-lg border border-slate-800 bg-slate-950 hover:border-slate-600 transition group ${checked ? 'border-amber-500/50 bg-amber-500/5' : ''}">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSubSelect(${i}, this.checked)" class="checkbox checkbox-sm text-amber-500">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] px-1.5 py-0.5 rounded border ${pClass} font-bold" title="${safeConfigName}">#${i + 1} ${safeConfigName}</span>
                <div class="text-[10px] text-slate-500 truncate flex-1" dir="ltr">${c.slice(0, 60)}</div>
              </div>
            </div>
            <button onclick="copySingleConfig(${i})" class="p-1.5 text-slate-500 hover:text-emerald-400 transition" title="کپی این کانفیگ">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            </button>
          </div>`;
      }).join('');

      updateSelBar();
      lucide.createIcons({ root: panel });
    }


    function toggleSubSelect(i, checked) {
      if (checked) selectedSubIndexes.add(i);
      else selectedSubIndexes.delete(i);
      renderSubList();
    }

    function selectAllConfigs() {
      const configs = getSubConfigs();

      renderSubList();
    }

    function updateSelBar() {
      const bar = document.getElementById('subSelectionBar');
      document.getElementById('selCount').innerText = selectedSubIndexes.size;
      bar.classList.toggle('hidden', selectedSubIndexes.size === 0);
      bar.classList.toggle('flex', selectedSubIndexes.size > 0);

      selectedSubIndexes.clear();
      renderSubList();
    }

    async function copySingleConfig(i) {
      const c = getSubConfigs()[i];
      try {
        await navigator.clipboard.writeText(c);
        showToast(`کانفیگ #${i + 1} کپی شد`);
      } catch (e) {
        prompt('کانفیگ:', c);
      }
    }

    async function copySelectedConfigs() {
      const configs = getSubConfigs();
      const sel = [...selectedSubIndexes].sort((a, b) => a - b).map(i => configs[i]).join('\n');
      if (!sel) return;
      try {
        await navigator.clipboard.writeText(sel);
        showToast(`${selectedSubIndexes.size} کانفیگ کپی شد`);
      } catch (e) {
        prompt('کانفیگ‌ها:', sel);
      }
    }

     // حذف دقیق و ذخیره خودکار روی گیت‌هاب
  async function deleteSelectedConfigs() {
    if (selectedSubIndexes.size === 0) return;
    
    const msg = "آیا از حذف " + selectedSubIndexes.size + " کانفیگ انتخاب‌شده و اعمال در گیت‌هاب اطمینان دارید؟";
    if (!confirm(msg)) return;

    const configs = getSubConfigs();
    const configsToDelete = new Set([...selectedSubIndexes].map(i => configs[i]));

    const allLines = document.getElementById('subContentArea').value.split('\n');
    const keep = allLines.filter(line => !configsToDelete.has(line.trim()));

    document.getElementById('subContentArea').value = keep.join('\n');
    selectedSubIndexes.clear();
    updateSubLineCount();
    renderSubList();

    // سینک آنی و کامیت مستقیم روی گیت‌هاب
    await saveSubFileAction();
  }

    async function openSubModal() {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');

      if (!o || !r || !t) {
        return showToast('لطفاً ابتدا تنظیمات گیت‌هاب را وارد کنید', 'warn');
      }

      showToast('در حال فراخوانی sub.txt...');
      try {
        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/sub.txt?t=${Date.now()}`, {
          headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json' }
        });

        if (!res.ok) {
          if (res.status === 404) {

            currentSubSha = "";

            toggleModal('subModal');
            showToast('فایل sub.txt وجود نداشت؛ می‌توانید ایجاد کنید', 'warn');

        toggleModal('subModal');
      } catch (err) {

    async function saveSubFileAction() {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');
      const content = document.getElementById('subContentArea').value;

      const btn = document.getElementById('saveSubBtn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> در حال انتشار...`;
      lucide.createIcons({ root: btn });

      try {
        const base64Content = encodeBase64Utf8(content);
        const payload = {
          message: 'Update sub.txt via Admin Panel',
          content: base64Content
        };
        if (currentSubSha) {
          payload.sha = currentSubSha;
        }

        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/sub.txt`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${t}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `خطا در ذخیره sub.txt: کد ${res.status}`);
        }

        const resData = await res.json();
        currentSubSha = resData.content.sha;
        const count = countValidConfigs(content);
        document.getElementById('subBadge').innerText = count;

        showToast('کانفیگ‌های ساب با موفقیت ذخیره و منتشر شد');
        toggleModal('subModal');
      } catch (err) {
        showToast('خطا در ذخیره کانفیگ‌ها: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> ذخیره و انتشار کانفیگ‌ها`;
        lucide.createIcons({ root: btn });
      }
    }

    function renderUsers() {
      const container = document.getElementById('userListContainer');
      const entries = Object.entries(usersData);

      let total = entries.length;
      let active = 0;
      let expiring = 0;
      let expired = 0;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (total === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">هیچ کاربری ثبت نشده است.</div>';
        updateStats(0, 0, 0, 0);
        return;
      }

      container.innerHTML = entries.map(([u, e], index) => {
        const expDate = new Date(e);
        expDate.setHours(0, 0, 0, 0);

        const diffTime = expDate.getTime() - today.getTime();
        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        const isExpired = diffDays < 0;

        let statusType = 'active';
        let statusBadge = '';

        if (isExpired) {
          expired++;
          statusType = 'expired';
          statusBadge = '<span class="px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] sm:text-xs font-bold shrink-0">منقضی</span>';
        } else {
          active++;
          if (diffDays <= 7) {
            expiring++;
            statusType = 'expiring';
            statusBadge = `<span class="px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] sm:text-xs font-bold shrink-0">فعال (${diffDays === 0 ? 'امروز' : diffDays + ' روز'})</span>`;
          } else {
            statusBadge = `<span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] sm:text-xs font-bold shrink-0">فعال (${diffDays} روز)</span>`;
          }
        }

        const safeUser = u.replace(/'/g, "\\'");

        return `
          <div class="user-card user-row flex items-center justify-between rounded-xl px-3 py-2.5 sm:px-5 sm:py-3.5 shadow-sm gap-2" data-status="${statusType}">
            
            <div class="flex items-center gap-2.5 sm:gap-4 min-w-0">
              <span class="font-mono text-xs sm:text-sm font-bold text-slate-500 w-5 sm:w-6 text-center shrink-0">#${index + 1}</span>
              <div class="min-w-0">
                <div class="name-cell font-bold text-sm sm:text-base text-white truncate">${u}</div>
                <div class="text-[11px] sm:text-xs font-mono text-slate-400 truncate">${e}</div>
              </div>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
              ${statusBadge}
              
              <button onclick="copySubLink('${safeUser}')" class="p-1.5 sm:p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 transition active:scale-95" title="کپی لینک ساب">
                <i data-lucide="link" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="generateQR('${safeUser}')" class="p-1.5 sm:p-2 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 hover:bg-indigo-500/20 transition active:scale-95" title="نمایش QR">
                <i data-lucide="qr-code" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="openEditModal('${safeUser}')" class="p-1.5 sm:p-2 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400 hover:bg-blue-500/20 transition active:scale-95" title="ویرایش">
                <i data-lucide="edit-3" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
              <button onclick="deleteUser('${safeUser}')" class="p-1.5 sm:p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 text-slate-400 hover:text-rose-400 hover:bg-rose-500/20 transition active:scale-95" title="حذف">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
              </button>
            </div>

          </div>
        `;
      }).join('');

      updateStats(total, active, expiring, expired);
      filterUsers();
      lucide.createIcons({ root: container });
    }

    function updateStats(total, active, expiring, expired) {
      document.getElementById('statTotal').innerText = total;
      document.getElementById('statActive').innerText = active;
      document.getElementById('statExpiring').innerText = expiring;
      document.getElementById('statExpired').innerText = expired;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-slate-400');
      });
      el.classList.add('bg-blue-600', 'text-white');
      el.classList.remove('text-slate-400');
      filterUsers();
    }

    function filterUsers() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      document.querySelectorAll('.user-card').forEach(card => {
        const text = card.innerText.toLowerCase();
        const status = card.getAttribute('data-status');

        const matchesQuery = text.includes(q);
        let matchesFilter = true;

        if (currentFilter === 'active') {
          matchesFilter = (status === 'active' || status === 'expiring');
        } else if (currentFilter === 'expiring') {
          matchesFilter = (status === 'expiring');
        } else if (currentFilter === 'expired') {
          matchesFilter = (status === 'expired');
        }

        card.style.display = (matchesQuery && matchesFilter) ? 'flex' : 'none';
      });
    }

    function openEditModal(u) {
      document.getElementById('editUsername').value = u;
      const expiry = usersData[u] || '';
      document.getElementById('editExpiry').value = expiry;
      if (fpEdit) fpEdit.setDate(expiry);
      toggleModal('editModal');
    }

    async function submitUpdate() {
      const u = document.getElementById('editUsername').value;
      const e = document.getElementById('editExpiry').value;
      if (!e) return showToast('تاریخ انقضا الزامی است!', 'warn');
      
      const previousExpiry = usersData[u];
      usersData[u] = e;
      const ok = await syncWithGitHub();
      if (ok) {
        toggleModal('editModal');
        renderUsers();
      } else {
        usersData[u] = previousExpiry; // بازگردانی در صورت خطا
      }
    }

    async function addUserAction() {
      const u = document.getElementById('usernameInput').value.trim();
      const e = document.getElementById('expiryInput').value;

      if (!u || !e) {
        return showToast('نام کاربری و تاریخ انقضا را مشخص کنید!', 'warn');
      }

      if (usersData[u]) {
        return showToast('این نام کاربری از قبل وجود دارد!', 'warn');
      }

      usersData[u] = e;
      const ok = await syncWithGitHub();
      if (ok) {
        document.getElementById('usernameInput').value = '';
        if (fpAdd) fpAdd.clear();
        renderUsers();
      } else {
        delete usersData[u]; // بازگردانی در صورت خطا
      }
    }

    async function deleteUser(u) {
      if (!confirm(`آیا از حذف کاربر «${u}» مطمئن هستید؟`)) return;
      const backupDate = usersData[u];
      delete usersData[u];
      const ok = await syncWithGitHub();
      if (ok) {
        renderUsers();
      } else {
        usersData[u] = backupDate; // بازگردانی در صورت خطا
      }
    }

    async function syncWithGitHub() {
      const o = localStorage.getItem('gh_owner');
      const r = localStorage.getItem('gh_repo');
      const t = localStorage.getItem('gh_token');

      try {
        const base64Content = encodeBase64Utf8(JSON.stringify(usersData, null, 2));

        const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/users.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${t}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: 'Update users via Admin Panel',
            content: base64Content,
            sha: currentSha
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `خطا در ذخیره‌سازی: کد ${res.status}`);
        }

        const resData = await res.json();
        currentSha = resData.content.sha;
        localStorage.setItem('users_cache', JSON.stringify(usersData));
        showToast('تغییرات با موفقیت ذخیره شد');
        return true;
      } catch (err) {
        showToast('خطا در همگام‌سازی: ' + err.message, 'error');
        return false;
      }
    }

    async function copySubLink(u) {
      const subLink = `https://sub-seven-psi.vercel.app/api?user=${encodeURIComponent(u)}#Sub:%20${encodeURIComponent(u)}`;
      try {
        await navigator.clipboard.writeText(subLink);
        showToast(`لینک اشتراک «${u}» کپی شد`);
      } catch (err) {
        prompt('لینک زیر را کپی کنید:', subLink);
      }
    }

    function generateQR(u) {
      const subLink = `https://sub-seven-psi.vercel.app/api?user=${encodeURIComponent(u)}#Sub:%20${encodeURIComponent(u)}`;
      const container = document.getElementById("qrcode");
      document.getElementById("qrModalTitle").innerText = `QR: ${u}`;
      container.innerHTML = "";
      
      new QRCode(container, {
        text: subLink,
        width: 170,
        height: 170,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      toggleModal('qrModal');
    }

    function exportBackupJSON() {
      if (Object.keys(usersData).length === 0) {
        return showToast('داده‌ای برای خروجی وجود ندارد!', 'warn');
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(usersData, null, 2));
      const downloadAnchor = document.createElement('a');
      const dateStr = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `users_backup_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('فایل بک‌آپ دانلود شد');
    }

    function saveConfig() {
      const o = document.getElementById('ghOwner').value.trim();
      const r = document.getElementById('ghRepo').value.trim();
      const t = document.getElementById('ghToken').value.trim();

      if (!o || !r || !t) {
        return showToast('هر سه فیلد تنظیمات الزامی است!', 'warn');
      }

      localStorage.setItem('gh_owner', o);
      localStorage.setItem('gh_repo', r);
      localStorage.setItem('gh_token', t);
      localStorage.removeItem('users_cache');

      toggleModal('configModal');
      loadUsersFromGitHub(true);
      fetchSubConfigCountSilently();
    }
  </script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('⚡ Turbo Admin PWA Ready!'))
          .catch((err) => console.log('SW Registration Error:', err));
      });
    }
  </script>
