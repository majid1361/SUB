<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات هیدیفای</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-md w-full text-center">
    
    <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
    </div>

    <h1 class="text-xl font-bold mb-2">تنظیمات بهینه هیدیفای</h1>
    <p class="text-sm text-slate-400 mb-6">روی دکمه زیر کلیک کنید تا کل تنظیمات کپی شود، سپس در هیدیفای Restore کنید.</p>

    <!-- دکمه کپی -->
    <button id="copyBtn" onclick="copyConfig()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 mb-4">
      <svg id="copyIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
      </svg>
      <span id="btnText">کپی کردن تنظیمات</span>
    </button>

    <!-- پیش‌نمایش متنی -->
    <div class="relative text-left">
      <textarea id="configBox" readonly class="w-full h-44 bg-slate-950 border border-slate-700 text-slate-300 font-mono text-xs p-3 rounded-lg focus:outline-none resize-none" dir="ltr">در حال دریافت تنظیمات...</textarea>
    </div>

  </div>

  <script>
    let rawConfig = "";

    // دریافت مستقیم فایل settings.json
    fetch('settings.json')
      .then(res => res.text())
      .then(data => {
        rawConfig = data;
        document.getElementById('configBox').value = data;
      })
      .catch(err => {
        document.getElementById('configBox').value = "خطا در بارگذاری فایل: " + err;
      });

    // تابع کپی هوشمند
    function copyConfig() {
      if (!rawConfig) return;
      navigator.clipboard.writeText(rawConfig).then(() => {
        const btn = document.getElementById('copyBtn');
        const btnText = document.getElementById('btnText');
        
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
        btnText.innerText = "✓ کپی شد!";

        setTimeout(() => {
          btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
          btn.classList.add('bg-blue-600', 'hover:bg-blue-500');
          btnText.innerText = "کپی کردن تنظیمات";
        }, 2500);
      });
    }
  </script>
</body>
</html>
